<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>연라이프 운영 현황 · 위험 한눈에</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#f7f4ed;--card:#fffdf8;--ink:#21302e;--ink2:#3a3631;--teal:#2f5d57;--teald:#264a44;--gold:#a96f36;--pine:#427a71;--line:#e7ddc9;--mut:#8a8275;
    --ok:#3f9d62;--okbg:#e7f3ea;--warn:#d29a2a;--warnbg:#fbf0d8;--bad:#cf4b36;--badbg:#fae3de;--serif:'Noto Serif KR',serif;--sans:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;padding:0 14px 70px}
  .wrap{max-width:1040px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 2px 6px}
  header h1{font-family:var(--serif);font-size:clamp(19px,3vw,25px);color:var(--teald);font-weight:900}
  header .upd{font-size:12px;color:var(--mut)} header .sp{flex:1}
  .pbtn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .pbtn:hover{background:var(--teal);color:#fff}

  /* 위험 배너 */
  .banner{border-radius:16px;padding:18px 22px;margin:8px 0 4px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1.5px solid}
  .banner.bad{background:var(--badbg);border-color:var(--bad)} .banner.warn{background:var(--warnbg);border-color:var(--warn)} .banner.ok{background:var(--okbg);border-color:var(--ok)}
  .banner .big{font-family:var(--serif);font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1}
  .banner.bad .big{color:var(--bad)} .banner.warn .big{color:var(--warn)} .banner.ok .big{color:var(--ok)}
  .banner .txt{flex:1;min-width:200px}
  .banner .txt b{font-size:15px} .banner .lst{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.7}
  .banner .lst .x{color:var(--bad);font-weight:800}
  .banner-act{flex:none;align-self:center;margin-left:auto;border:none;border-radius:10px;padding:11px 18px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;background:var(--bad);color:#fff;white-space:nowrap;box-shadow:0 3px 10px rgba(182,84,63,.32)}
  .banner-act:hover{background:#a8412f}
  @media(max-width:560px){.banner-act{margin-left:0;width:100%}}

  h2.sec{font-family:var(--serif);font-size:15px;color:var(--ink);margin:24px 2px 10px;font-weight:800;border-left:4px solid var(--gold);padding-left:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}

  /* 게이지 카드들 */
  .gauges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;position:relative}
  .gauge.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--badbg)}
  .gauge .lbl{font-size:12.5px;color:var(--mut);font-weight:700}
  .gauge svg{width:150px;height:86px;display:block;margin:4px auto 0}
  .gauge .val{font-family:var(--serif);font-size:24px;font-weight:900;margin-top:-30px}
  .gauge .sub{font-size:11px;color:var(--mut);margin-top:18px}
  .gauge .tag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
  .tag.bad{background:var(--bad);color:#fff} .tag.warn{background:var(--warn);color:#fff} .tag.ok{background:var(--ok);color:#fff}
  .pulse{animation:pl 1.1s ease-in-out infinite} @keyframes pl{50%{opacity:.45}}

  /* 카테고리 막대 */
  .bars .row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12.5px}
  .bars .row .nm{width:120px;flex:none;color:var(--ink2);font-weight:600}
  .bars .row .track{flex:1;height:18px;background:#efe8d8;border-radius:6px;overflow:hidden}
  .bars .row .track span{display:block;height:100%;border-radius:6px;background:var(--pine)}
  .bars .row .track span.bad{background:var(--bad)} .bars .row .track span.warn{background:var(--warn)}
  .bars .row .v{width:64px;flex:none;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

  /* 추세 차트 */
  .chart svg{width:100%;height:170px;display:block}
  .chart .lg{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .chart .lg i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .chip{width:12px;height:3px;border-radius:2px;display:inline-block}
  .grid2{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}

  /* 서버 */
  .srv{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .srv a{display:flex;flex-direction:column;align-items:stretch;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-decoration:none;color:var(--ink)}
  .srv a:hover{border-color:var(--teal)}
  .srv-top{display:flex;align-items:center;gap:9px}
  .lat{height:5px;background:#efe8d8;border-radius:999px;overflow:hidden}
  .lat span{display:block;height:100%;width:0;background:#cfc7b8;transition:width .5s ease}
  .dot{width:11px;height:11px;border-radius:50%;background:#cfc7b8;flex:none}
  .dot.up{background:var(--ok)} .dot.down{background:var(--bad)} .dot.chk{background:var(--warn);animation:pl 1s infinite}
  .srv .nm{font-weight:700;font-size:13px} .srv .ds{font-size:10.5px;color:var(--mut)}
  .srv .role{margin-left:auto;font-size:9.5px;color:var(--mut);background:#f0ece3;border-radius:999px;padding:2px 7px}

  /* 작업 지도 */
  .map{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .mcard h3{font-family:var(--serif);font-size:14px;color:var(--teald);margin-bottom:6px}
  .mcard a{display:block;font-size:12px;color:var(--ink2);text-decoration:none;padding:4px 0;border-bottom:1px dashed rgba(40,32,20,.06)}
  .mcard a:hover{color:var(--teal)} .mcard a .s{font-size:10px;color:var(--mut)} .mcard a .s.x{color:var(--bad);font-weight:700}
  .mcard a.soon{color:var(--mut);pointer-events:none}

  /* 체크 */
  .tasks .grp{margin-bottom:12px} .tasks .gh{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold);margin-bottom:5px}
  .tk{display:flex;align-items:flex-start;gap:9px;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(40,32,20,.05)}
  .tk input{margin-top:3px;width:15px;height:15px;flex:none;accent-color:var(--teal)} .tk.done label{color:var(--mut);text-decoration:line-through}
  .tk .d{font-size:11px;color:var(--bad);font-weight:600}
  .actbtn{margin-left:auto;flex:none;font-family:inherit;font-size:11px;font-weight:700;text-decoration:none;border-radius:8px;padding:4px 10px;cursor:pointer;border:1px solid var(--teal);background:var(--teal);color:#fff;white-space:nowrap}
  .actbtn:hover{background:var(--teald)}
  .actbtn.chat{background:#fff;color:var(--teal)}
  .actbtn.chat:hover{background:#eef5f3}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#21302e;color:#fff;font-size:12.5px;padding:11px 18px;border-radius:10px;max-width:90vw;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .note{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.7}
  footer{text-align:center;font-size:11px;color:var(--mut);margin-top:24px;padding-top:16px;border-top:1px solid var(--line)} footer a{color:var(--teal)}
  @media print{.pbtn{display:none} body{padding:0} .card,.mcard,.srv a,.gauge{box-shadow:none;break-inside:avoid}}
  @media print{body.eco *{background:#fff!important;color:#000!important}}
</style>
</head>

  <footer>관리자용(noindex) · Claude가 점검 때마다 갱신 · <a href="/">홈</a></footer>
</div>

(function(){

  RES.forEach(function(r){var p=r.lim?r.cur/r.lim*100:0; if(p>=100)risks.push(r.nm+' 한도 초과('+(r.key==='host'?r.cur+'/'+r.lim+'GB':Math.round(p)+'%')+')'); else if(p>=80)risks.push(r.nm+' '+Math.round(p)+'%');});
  CATS.forEach(function(c){if(c.danger&&c.gb>=1)risks.push(c.nm+' '+c.gb+'GB 과대');});
  var bad=risks.length>0;
  var b=document.getElementById('banner');
  b.className='banner '+(bad?'bad':'ok');
  b.innerHTML='<div class="big">'+(bad?'위험 '+risks.length+'건':'정상')+'</div>'
    +'<div class="txt"><b>'+(bad?'지금 손봐야 할 곳이 있습니다.':'특이 위험 없음.')+'</b>'
    +(bad?'<div class="lst">'+risks.map(function(x){return '<span class="x">●</span> '+esc(x);}).join('<br>')+'</div>':'')+'</div>'
    +(bad?'<button class="banner-act" onclick="copyChat(\'운영현황 위험 지금 처리해줘\')">지금 바로 처리해줘</button>':'');
})();

/* ── 반원 게이지 ── */
function gaugeSVG(p,l){
  var col=l==='bad'?'#cf4b36':l==='warn'?'#d29a2a':'#3f9d62';
  var W=150,H=86,cx=75,cy=78,r=60, a=Math.PI*(1-Math.min(p,100)/100);
  var ex=cx+r*Math.cos(a), ey=cy-r*Math.sin(a);
  function arc(col,frac,w){var aa=Math.PI*(1-frac);var x=cx+r*Math.cos(aa),y=cy-r*Math.sin(aa);return '<path d="M'+(cx-r)+' '+cy+' A'+r+' '+r+' 0 0 1 '+x+' '+y+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';}
  return '<svg viewBox="0 0 '+W+' '+H+'">'
    +'<path d="M'+(cx-r)+' '+cy+' A'+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="#ece4d3" stroke-width="12"/>'
    +'<path d="M'+(cx-r)+' '+cy+' A'+r+' '+r+' 0 0 1 '+ex+' '+ey+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round"/>'
    +'</svg>';
}
(function(){
  document.getElementById('gauges').innerHTML=RES.map(function(r){
    var p=r.lim?Math.round(r.cur/r.lim*100):0; var l=lvl(p);
    var valTxt = r.key==='host'?r.cur+'GB' : r.key==='cost'?'₩'+r.cur.toLocaleString() : p+'%';
    var sub = r.key==='host'?('/ '+r.lim+'GB · '+p+'%') : r.key==='cost'?('예산 ₩'+r.lim.toLocaleString()) : (r.cur.toLocaleString()+' / '+r.lim.toLocaleString()+(r.unit?r.unit:''));
    return '<div class="gauge'+(l==='bad'?' bad pulse':'')+'"><span class="tag '+l+'">'+lvlTxt(l)+'</span>'
      +'<div class="lbl">'+esc(r.nm)+'</div>'+gaugeSVG(p,l)
      +'<div class="val" style="color:'+(l==='bad'?'#cf4b36':l==='warn'?'#d29a2a':'#264a44')+'">'+valTxt+'</div>'
      +'<div class="sub">'+esc(sub)+'</div></div>';
  }).join('');
})();

/* ── 카테고리 막대 ── */
(function(){
  var max=Math.max.apply(null,CATS.map(function(c){return c.gb;}));
  document.getElementById('cats').innerHTML='<div class="note" style="margin:0 0 8px">정리 후 <b style="color:#3f9d62">도서관 0.76GB</b> — 중복(971MB)·미사용 PNG(424MB) 정리 완료. 다음 = R2 분리로 거의 0.</div>'
    +CATS.map(function(c){var w=Math.max(3,c.gb/max*100);var cls=c.gb>=1?'bad':c.gb>=0.3?'warn':'';
      return '<div class="row"><span class="nm">'+esc(c.nm)+'</span><span class="track"><span class="'+cls+'" style="width:'+w+'%"></span></span><span class="v"'+(c.gb>=1?' style="color:#cf4b36"':'')+'>'+c.gb+'GB</span></div>';
    }).join('');
})();

/* ── 추세 차트 ── */
(function(){
  CAP.forEach(function(c){c.cost10=c.cost/1000;});
  var W=520,H=170,pad=30, LIM=1;
  var maxV=Math.max(LIM,Math.max.apply(null,CAP.map(function(c){return c.host;})))*1.08;
  function x(i){return pad+i/Math.max(1,CAP.length-1)*(W-pad*2);}
  function y(v){return H-24-(v/maxV)*(H-44);}
  function ln(k,col){if(CAP.length<2)return '<circle cx="'+x(0)+'" cy="'+y(CAP[0][k])+'" r="3.5" fill="'+col+'"/>';
    return '<polyline points="'+CAP.map(function(c,i){return x(i)+','+y(c[k]);}).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round"/>'+CAP.map(function(c,i){return '<circle cx="'+x(i)+'" cy="'+y(c[k])+'" r="3" fill="'+col+'"/>';}).join('');}
  var ly=y(LIM);
  document.getElementById('trend').innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'
    +'<rect x="'+pad+'" y="0" width="'+(W-pad*2)+'" height="'+ly+'" fill="#cf4b36" opacity=".06"/>'
    +'<line x1="'+pad+'" y1="'+ly+'" x2="'+(W-pad)+'" y2="'+ly+'" stroke="#cf4b36" stroke-width="1.2" stroke-dasharray="5 3"/>'
    +'<text x="'+(W-pad)+'" y="'+(ly-4)+'" text-anchor="end" font-size="9.5" fill="#cf4b36" font-weight="700">GitHub 권장 1GB (위는 빌드 느림)</text>'
    +ln('cost10','#a96f36')+ln('lib','#427a71')+ln('host','#cf4b36')
    +CAP.map(function(c,i){return '<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="#8a8275">'+esc(c.d)+'</text>';}).join('')
    +'</svg>';
})();

/* ── 서버 ── */
document.getElementById('srv').innerHTML=SERVERS.map(function(s,i){return '<a href="'+s.url+'" target="_blank" rel="noopener"><span class="srv-top"><span class="dot" id="dot'+i+'"></span><span style="flex:1"><span class="nm">'+esc(s.nm)+'</span><br><span class="ds">'+esc(s.ds)+'</span></span><span class="role">'+esc(s.role)+'</span></span><span class="lat"><span id="lat'+i+'"></span></span></a>';}).join('');
function pingAll(){SERVERS.forEach(function(s,i){var d=document.getElementById('dot'+i),L=document.getElementById('lat'+i);d.className='dot chk';if(L){L.style.width='0';}var t0=performance.now();fetch(s.url,{mode:'no-cors',cache:'no-store'}).then(function(){var ms=performance.now()-t0;d.className='dot up';if(L){L.style.width=Math.max(8,Math.min(100,100-ms/14))+'%';L.style.background=ms<350?'#3f9d62':ms<900?'#d29a2a':'#cf4b36';L.parentNode.title='응답 '+Math.round(ms)+'ms (막대 길수록 빠름)';}}).catch(function(){d.className='dot down';if(L){L.style.width='100%';L.style.background='#cf4b36';L.parentNode.title='응답 없음';}});});}
pingAll();

/* ── 작업 지도 (+ 내용 맞춤 미니 그래프) ── */
function miniGraph(gr){
  if(!gr) return '';
  var w,bar,txt,vtxt;
  if(gr.type==='progress'){var p=Math.round(gr.v/gr.total*100);w=p;bar=p>=100?'#3f9d62':'#427a71';txt=p>=100?'#3f9d62':'#264a44';vtxt=gr.v+'/'+gr.total+' ('+p+'%)';}
  else if(gr.type==='storage'){var r=gr.gb/gr.budget;w=Math.min(100,r*20);bar=gr.gb>gr.budget?'#cf4b36':'#427a71';txt=gr.gb>gr.budget?'#cf4b36':'#264a44';vtxt=gr.gb+'GB'+(gr.gb>gr.budget?' ↑초과':'');}
  else if(gr.type==='cost'){var c=Math.round(gr.won/gr.cap*100);w=Math.min(100,c);bar=c>=100?'#cf4b36':c>=80?'#d29a2a':'#427a71';txt=c>=80?(c>=100?'#cf4b36':'#d29a2a'):'#264a44';vtxt='₩'+gr.won.toLocaleString()+' / ₩'+gr.cap.toLocaleString()+' ('+c+'%)';}
  else return '';
  return '<div style="margin-top:10px;padding-top:9px;border-top:1px solid rgba(40,32,20,.07)">'
    +'<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-bottom:4px"><span>'+esc(gr.label)+'</span><span style="font-weight:700;color:'+txt+'">'+esc(vtxt)+'</span></div>'
    +'<div style="height:7px;background:#efe8d8;border-radius:999px;overflow:hidden"><span style="display:block;height:100%;border-radius:999px;width:'+w+'%;background:'+bar+'"></span></div></div>';
}
document.getElementById('map').innerHTML=MAP.map(function(g){return '<div class="mcard"><h3>'+esc(g.h)+'</h3>'+g.items.map(function(it){return '<a href="'+it.u+'"'+(it.soon?' class="soon"':' target="_blank" rel="noopener"')+'>'+esc(it.t)+(it.s?' <span class="s'+(it.x?' x':'')+'">· '+esc(it.s)+'</span>':'')+'</a>';}).join('')+miniGraph(g.gr)+'</div>';}).join('');

/* ── 체크 ── */
var TKEY='yeon_ops_tasks';function tstate(){try{return JSON.parse(localStorage.getItem(TKEY))||{};}catch(e){return {};}}
function actBtn(it){if(!it.act)return '';var a=it.act;
  if(a.kind==='link')return '<a class="actbtn" href="'+a.url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(a.label)+' →</a>';
  return '<button class="actbtn chat" onclick="copyChat(\''+esc(a.phrase)+'\')">'+esc(a.label)+'</button>';}
function copyChat(p){try{navigator.clipboard.writeText(p);}catch(e){}var t=document.getElementById('toast');t.textContent='복사됨 — 채팅창에 붙여넣기(Ctrl+V) 후 보내세요: "'+p+'"';t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},3500);}
(function(){var st=tstate();document.getElementById('tasks').innerHTML=TASKS.map(function(g){return '<div class="grp"><div class="gh">'+esc(g.g)+'</div>'+g.items.map(function(it){var id=g.g+'::'+it.t;var ck=(id in st)?st[id]:!!it.done;return '<div class="tk'+(ck?' done':'')+'"><input type="checkbox" data-id="'+esc(id)+'"'+(ck?' checked':'')+'><label>'+esc(it.t)+(it.d?' <span class="d">· '+esc(it.d)+'</span>':'')+'</label>'+actBtn(it)+'</div>';}).join('')+'</div>';}).join('');
  document.getElementById('tasks').addEventListener('change',function(e){var cb=e.target;if(cb.type!=='checkbox')return;var st=tstate();st[cb.dataset.id]=cb.checked;try{localStorage.setItem(TKEY,JSON.stringify(st));}catch(_){}cb.closest('.tk').classList.toggle('done',cb.checked);});})();

/* ── 약속·점검 이력 ── */
(function(){
  var stMap={done:['정상·이행','#3f9d62','#e7f3ea'],wip:['진행중','#d29a2a','#fbf0d8'],wait:['대기','#8a8275','#f0ece3']};
  var rows=COMMITS.map(function(c){var s=stMap[c.st]||stMap.wait;
    return '<tr style="border-top:1px solid var(--line)">'
      +'<td style="padding:8px 8px;white-space:nowrap;font-size:11.5px;color:var(--mut)">'+esc(c.when)+'</td>'
      +'<td style="padding:8px 8px;font-weight:700;font-size:12.5px">'+esc(c.dev)+'</td>'
      +'<td style="padding:8px 8px;font-size:11.5px;color:var(--ink2)">'+esc(c.base)+'</td>'
      +'<td style="padding:8px 8px;font-size:12px">'+esc(c.promise)+'</td>'
      +'<td style="padding:8px 8px;font-size:11.5px;color:var(--mut);white-space:nowrap">'+esc(c.check)+'</td>'
      +'<td style="padding:8px 8px"><span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;color:'+s[1]+';background:'+s[2]+'">'+s[0]+'</span></td></tr>';
  }).join('');
  document.getElementById('commits').innerHTML=
    '<div class="note" style="margin:0 0 8px">아래 시점·약속을 기준으로, 나중에 <b>약속대로 됐는지</b> 평가하세요. 평가일에 실제값을 적어 비교합니다.</div>'
    +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:560px">'
    +'<thead><tr style="text-align:left;font-size:11px;color:var(--mut)"><th style="padding:4px 8px">시점</th><th style="padding:4px 8px">만든 장치</th><th style="padding:4px 8px">그때 기준값</th><th style="padding:4px 8px">약속(목표)</th><th style="padding:4px 8px">평가일</th><th style="padding:4px 8px">상태</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
})();

function ylPrint(eco){document.body.classList.toggle('eco',!!eco);setTimeout(function(){window.print();},60);}
window.addEventListener('afterprint',function(){document.body.classList.remove('eco');});
</script>
