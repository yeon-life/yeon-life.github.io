<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연 프로젝트 컬러 프리셋</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* ══ 연 프로젝트 공식 팔레트 18색 ══ */
  /* Teal/Mint */
  --yeon-teal-primary:     #6eb5a6;
  --yeon-teal-light:       #b0cfc8;
  --yeon-mint-white:       #e9f5f2;
  --yeon-gray-teal:        #959e9c;
  --yeon-deep-teal:        #586e69;
  --yeon-green-white:      #ebf2ed;
  /* Warm/Earth */
  --yeon-light-gray:       #ebebeb;
  --yeon-sage-green:       #dfe6d3;
  --yeon-warm-khaki:       #dbd2a4;
  --yeon-tan-camel:        #ad9d82;
  --yeon-warm-beige:       #d4cdc1;
  --yeon-soft-mauve:       #b2a7b8;
  /* Dark/Neutral */
  --yeon-dark-gray-purple: #615b63;
  --yeon-deep-green-black: #2a2e2c;
  --yeon-mid-sage:         #697870;
  --yeon-medium-gray:      #c4c4c4;
  --yeon-deep-forest:      #2b3b32;
  --yeon-deep-navy:        #37334f;

  /* 현재 테마: Mint Tide */
  --color-bg:          var(--yeon-mint-white);
  --color-surface:     var(--yeon-teal-light);
  --color-surface-alt: var(--yeon-sage-green);
  --color-primary:     var(--yeon-teal-primary);
  --color-primary-dk:  var(--yeon-deep-teal);
  --color-muted:       var(--yeon-gray-teal);
  --color-text:        var(--yeon-deep-green-black);
  --color-text-light:  var(--yeon-mid-sage);
  --color-border:      var(--yeon-medium-gray);
  --color-disabled:    var(--yeon-light-gray);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f4f4f0;
  color: var(--yeon-deep-green-black);
  min-height: 100vh;
  padding: 40px 24px;
}

.page-wrap { max-width: 860px; margin: 0 auto; }

/* ── 헤더 ── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 36px;
  padding-bottom: 20px;
  border-bottom: 1.5px solid var(--yeon-medium-gray);
}
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.page-title span { color: var(--yeon-teal-primary); }
.page-sub { font-size: 13px; color: var(--yeon-mid-sage); margin-top: 4px; }
.badge {
  font-size: 11px; font-weight: 500; color: var(--yeon-deep-teal);
  background: var(--yeon-mint-white); border: 1px solid var(--yeon-teal-light);
  border-radius: 20px; padding: 4px 12px;
}

/* ── 섹션 ── */
.section { margin-bottom: 40px; }
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--yeon-mid-sage); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--yeon-medium-gray);
}

/* ── 스워치 ── */
.swatch-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.swatch {
  border-radius: 12px; overflow: hidden;
  background: #fff;
  border: 1px solid rgba(0,0,0,.07);
  transition: transform .15s, box-shadow .15s;
  cursor: default;
}
.swatch:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.1); }
.swatch-color { height: 72px; position: relative; }
.swatch-copy {
  position: absolute; bottom: 6px; right: 6px;
  font-size: 10px; background: rgba(0,0,0,.25); color: #fff;
  padding: 2px 7px; border-radius: 8px; border: none; cursor: pointer;
  opacity: 0; transition: opacity .15s; font-family: 'Noto Sans KR', sans-serif;
}
.swatch:hover .swatch-copy { opacity: 1; }
.swatch-info { padding: 10px 12px 12px; }
.swatch-name { font-size: 12px; font-weight: 500; color: var(--yeon-deep-green-black); display: block; }
.swatch-hex  { font-size: 11px; color: var(--yeon-mid-sage); margin-top: 2px; display: block; font-feature-settings: 'tnum'; }
.swatch-role { font-size: 10px; color: var(--yeon-gray-teal); margin-top: 3px; display: block; }

/* ── 테마 ── */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
}
.theme-card {
  background: #fff;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,.07);
  overflow: hidden;
  transition: transform .15s, box-shadow .15s;
}
.theme-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
.theme-header {
  padding: 14px 14px 12px;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.theme-name { font-size: 13px; font-weight: 700; }
.theme-desc { font-size: 11px; color: var(--yeon-mid-sage); margin-top: 3px; }
.theme-dots { display: flex; gap: 5px; margin-top: 10px; }
.dot {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.1);
  position: relative;
}
.dot-label {
  display: none;
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 9px; white-space: nowrap; color: var(--yeon-mid-sage);
}
.dot:hover .dot-label { display: block; }
.theme-roles { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.role-row { display: flex; align-items: center; justify-content: space-between; }
.role-key { font-size: 11px; color: var(--yeon-mid-sage); }
.role-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500; color: var(--yeon-deep-green-black);
}
.role-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.1); flex-shrink: 0; }

/* ── CSS 변수 박스 ── */
.var-box {
  background: #1e2422;
  border-radius: 14px;
  padding: 22px 24px;
  position: relative;
  overflow: hidden;
}
.var-box-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.var-box-title { font-size: 12px; font-weight: 500; color: #8aada6; letter-spacing: .06em; }
.copy-all-btn {
  font-size: 11px; background: rgba(110,181,166,.2); color: #6eb5a6;
  border: 1px solid rgba(110,181,166,.35); border-radius: 8px;
  padding: 4px 12px; cursor: pointer; transition: background .15s;
  font-family: 'Noto Sans KR', sans-serif;
}
.copy-all-btn:hover { background: rgba(110,181,166,.35); }
pre {
  font-family: 'SF Mono', 'Fira Mono', monospace;
  font-size: 12px; line-height: 1.85; color: #b0d4ce;
  white-space: pre-wrap; word-break: break-all;
  max-height: 320px; overflow-y: auto;
}
pre .cm  { color: #697870; }
pre .var { color: #8cc8be; }
pre .val { color: #dbd2a4; }
pre .grp { color: #6eb5a6; font-weight: 700; }

/* ── 알림 토스트 ── */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--yeon-deep-green-black); color: #e9f5f2;
  font-size: 13px; padding: 10px 20px; border-radius: 24px;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 반응형 ── */
@media (max-width: 500px) {
  .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .swatch-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="page-wrap">

  <!-- 헤더 -->
  <div class="page-header">
    <div>
      <div class="page-title">연 프로젝트 <span>컬러 프리셋</span></div>
      <div class="page-sub">공식 팔레트 18색 · 테마 4종 · CSS 변수</div>
    </div>
    <div class="badge">yeon-design v1.0</div>
  </div>

  <!-- 틸·민트 계열 -->
  <div class="section">
    <div class="section-label">틸·민트 계열</div>
    <div class="swatch-grid" id="teal-grid"></div>
  </div>

  <!-- 웜·어스 계열 -->
  <div class="section">
    <div class="section-label">웜·어스 계열</div>
    <div class="swatch-grid" id="warm-grid"></div>
  </div>

  <!-- 다크·뉴트럴 계열 -->
  <div class="section">
    <div class="section-label">다크·뉴트럴 계열</div>
    <div class="swatch-grid" id="dark-grid"></div>
  </div>

  <!-- 테마 -->
  <div class="section">
    <div class="section-label">4가지 테마</div>
    <div class="theme-grid" id="theme-grid"></div>
  </div>

  <!-- CSS 변수 박스 -->
  <div class="section">
    <div class="section-label">CSS 변수 복사</div>
    <div class="var-box">
      <div class="var-box-header">
        <span class="var-box-title">style.css / :root { ... }</span>
        <button class="copy-all-btn" onclick="copyAll()">전체 복사</button>
      </div>
      <pre id="css-pre"></pre>
    </div>
  </div>

</div>
<div class="toast" id="toast">복사됨!</div>

<script>
const TEAL = [
  { name:'Teal Primary',     hex:'#6eb5a6', var:'--yeon-teal-primary',     role:'주요 버튼·링크·강조' },
  { name:'Teal Light',       hex:'#b0cfc8', var:'--yeon-teal-light',       role:'카드·패널 서피스' },
  { name:'Mint White',       hex:'#e9f5f2', var:'--yeon-mint-white',       role:'밝은 배경' },
  { name:'Gray Teal',        hex:'#959e9c', var:'--yeon-gray-teal',        role:'보조 텍스트·비활성' },
  { name:'Deep Teal',        hex:'#586e69', var:'--yeon-deep-teal',        role:'어두운 강조·헤더' },
  { name:'Green White',      hex:'#ebf2ed', var:'--yeon-green-white',      role:'대체 배경' },
];
const WARM = [
  { name:'Light Gray',       hex:'#ebebeb', var:'--yeon-light-gray',       role:'구분선·비활성' },
  { name:'Sage Green',       hex:'#dfe6d3', var:'--yeon-sage-green',       role:'부드러운 서피스' },
  { name:'Warm Khaki',       hex:'#dbd2a4', var:'--yeon-warm-khaki',       role:'따뜻한 포인트' },
  { name:'Tan Camel',        hex:'#ad9d82', var:'--yeon-tan-camel',        role:'웜 계열 Primary' },
  { name:'Warm Beige',       hex:'#d4cdc1', var:'--yeon-warm-beige',       role:'따뜻한 배경' },
  { name:'Soft Mauve',       hex:'#b2a7b8', var:'--yeon-soft-mauve',       role:'상담·감성 UI' },
];
const DARK = [
  { name:'Dark Gray Purple', hex:'#615b63', var:'--yeon-dark-gray-purple', role:'어두운 UI 강조' },
  { name:'Deep Green Black', hex:'#2a2e2c', var:'--yeon-deep-green-black', role:'기본 본문 텍스트' },
  { name:'Mid Sage',         hex:'#697870', var:'--yeon-mid-sage',         role:'보조 텍스트·아이콘' },
  { name:'Medium Gray',      hex:'#c4c4c4', var:'--yeon-medium-gray',      role:'비활성·보더' },
  { name:'Deep Forest',      hex:'#2b3b32', var:'--yeon-deep-forest',      role:'다크 배경' },
  { name:'Deep Navy',        hex:'#37334f', var:'--yeon-deep-navy',        role:'어두운 텍스트·다크 배경' },
];
const THEMES = [
  {
    name:'Mint Tide', desc:'학습 앱 · 집중 화면', tag:'기본',
    roles:[
      { key:'Background',   hex:'#e9f5f2', label:'Mint White' },
      { key:'Surface',      hex:'#b0cfc8', label:'Teal Light' },
      { key:'Surface Alt',  hex:'#dfe6d3', label:'Sage Green' },
      { key:'Primary',      hex:'#6eb5a6', label:'Teal Primary' },
      { key:'Primary Dark', hex:'#586e69', label:'Deep Teal' },
      { key:'Text',         hex:'#2a2e2c', label:'Deep Green Black' },
      { key:'Text Light',   hex:'#697870', label:'Mid Sage' },
    ]
  },
  {
    name:'Warm Earth', desc:'학부모 보고서 · 안내문', tag:'',
    roles:[
      { key:'Background',   hex:'#d4cdc1', label:'Warm Beige' },
      { key:'Surface',      hex:'#dbd2a4', label:'Warm Khaki' },
      { key:'Surface Alt',  hex:'#dfe6d3', label:'Sage Green' },
      { key:'Primary',      hex:'#ad9d82', label:'Tan Camel' },
      { key:'Primary Dark', hex:'#697870', label:'Mid Sage' },
      { key:'Text',         hex:'#2a2e2c', label:'Deep Green Black' },
      { key:'Text Light',   hex:'#615b63', label:'Dark Gray Purple' },
    ]
  },
  {
    name:'Mauve Fog', desc:'상담 · 감성 화면', tag:'',
    roles:[
      { key:'Background',   hex:'#ebf2ed', label:'Green White' },
      { key:'Surface',      hex:'#b2a7b8', label:'Soft Mauve' },
      { key:'Surface Alt',  hex:'#ebebeb', label:'Light Gray' },
      { key:'Primary',      hex:'#615b63', label:'Dark Gray Purple' },
      { key:'Primary Dark', hex:'#37334f', label:'Deep Navy' },
      { key:'Text',         hex:'#37334f', label:'Deep Navy' },
      { key:'Text Light',   hex:'#615b63', label:'Dark Gray Purple' },
    ]
  },
  {
    name:'Forest Dark', desc:'야간 모드 · 집중 모드', tag:'',
    roles:[
      { key:'Background',   hex:'#2b3b32', label:'Deep Forest' },
      { key:'Surface',      hex:'#586e69', label:'Deep Teal' },
      { key:'Surface Alt',  hex:'#697870', label:'Mid Sage' },
      { key:'Primary',      hex:'#6eb5a6', label:'Teal Primary' },
      { key:'Primary Dark', hex:'#b0cfc8', label:'Teal Light' },
      { key:'Text',         hex:'#e9f5f2', label:'Mint White' },
      { key:'Text Light',   hex:'#b0cfc8', label:'Teal Light' },
    ]
  },
];

function isLight(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 155;
}

function makeSwatch(c) {
  const light = isLight(c.hex);
  return `<div class="swatch">
    <div class="swatch-color" style="background:${c.hex};">
      <button class="swatch-copy" onclick="copyText('${c.hex}')">${c.hex}</button>
    </div>
    <div class="swatch-info">
      <span class="swatch-name">${c.name}</span>
      <span class="swatch-hex">${c.hex}</span>
      <span class="swatch-role">${c.role}</span>
    </div>
  </div>`;
}

document.getElementById('teal-grid').innerHTML = TEAL.map(makeSwatch).join('');
document.getElementById('warm-grid').innerHTML = WARM.map(makeSwatch).join('');
document.getElementById('dark-grid').innerHTML = DARK.map(makeSwatch).join('');

document.getElementById('theme-grid').innerHTML = THEMES.map(t => `
  <div class="theme-card">
    <div class="theme-header">
      <div class="theme-name">${t.name} ${t.tag ? `<span style="font-size:10px;background:#e9f5f2;color:#586e69;border-radius:8px;padding:2px 8px;font-weight:400;margin-left:4px;">${t.tag}</span>` : ''}</div>
      <div class="theme-desc">${t.desc}</div>
      <div class="theme-dots">
        ${t.roles.slice(0,5).map(r=>`<div class="dot" style="background:${r.hex};" title="${r.key}"></div>`).join('')}
      </div>
    </div>
    <div class="theme-roles">
      ${t.roles.map(r=>`<div class="role-row">
        <span class="role-key">${r.key}</span>
        <span class="role-chip"><span class="role-dot" style="background:${r.hex};"></span>${r.label}</span>
      </div>`).join('')}
    </div>
  </div>
`).join('');

const ALL = [...TEAL,...WARM,...DARK];
const CSS_TEXT = `:root {
  /* ══ Teal/Mint ══ */
  --yeon-teal-primary:     #6eb5a6;
  --yeon-teal-light:       #b0cfc8;
  --yeon-mint-white:       #e9f5f2;
  --yeon-gray-teal:        #959e9c;
  --yeon-deep-teal:        #586e69;
  --yeon-green-white:      #ebf2ed;
  /* ══ Warm/Earth ══ */
  --yeon-light-gray:       #ebebeb;
  --yeon-sage-green:       #dfe6d3;
  --yeon-warm-khaki:       #dbd2a4;
  --yeon-tan-camel:        #ad9d82;
  --yeon-warm-beige:       #d4cdc1;
  --yeon-soft-mauve:       #b2a7b8;
  /* ══ Dark/Neutral ══ */
  --yeon-dark-gray-purple: #615b63;
  --yeon-deep-green-black: #2a2e2c;
  --yeon-mid-sage:         #697870;
  --yeon-medium-gray:      #c4c4c4;
  --yeon-deep-forest:      #2b3b32;
  --yeon-deep-navy:        #37334f;

  /* ══ 시맨틱 (Mint Tide 기본) ══ */
  --color-bg:          var(--yeon-mint-white);
  --color-surface:     var(--yeon-teal-light);
  --color-surface-alt: var(--yeon-sage-green);
  --color-primary:     var(--yeon-teal-primary);
  --color-primary-dk:  var(--yeon-deep-teal);
  --color-muted:       var(--yeon-gray-teal);
  --color-text:        var(--yeon-deep-green-black);
  --color-text-light:  var(--yeon-mid-sage);
  --color-border:      var(--yeon-medium-gray);
  --color-disabled:    var(--yeon-light-gray);
}`;

document.getElementById('css-pre').innerHTML = CSS_TEXT
  .replace(/\/\* ══.*?══ \*\//g, m => `<span class="grp">${m}</span>`)
  .replace(/(--[\w-]+)(\s*:\s*)(#[\da-fA-F]{6}|var\([^)]+\))/g,
    (_, v, c, val) => `<span class="var">${v}</span>${c}<span class="val">${val}</span>`);

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg || '복사됨!';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast(text + ' 복사됨'));
}
function copyAll() {
  navigator.clipboard.writeText(CSS_TEXT).then(() => showToast('CSS 변수 전체 복사됨!'));
}
</script>
</body>
</html>
