<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store"><title>연 작은도서관 — 한글 깨우기 책장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pine:#2f5d62;--teal:#6eb5a6;--gold:#c38d56;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans KR",sans-serif;color:#2a2e2c;min-height:100vh;
 background:radial-gradient(ellipse at 50% 22%,#fbf7ef,#eee2d0);padding:34px 18px 70px;}
.head{max-width:1100px;margin:0 auto 22px;text-align:center;}
.head h1{font-family:"Noto Serif KR",serif;font-size:clamp(22px,4.5vw,32px);color:var(--pine);}
.head p{color:#7a8480;margin-top:8px;font-size:14px;}
.head a.myshelf{display:inline-flex;align-items:center;gap:7px;margin-top:14px;color:var(--pine);text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid var(--teal);border-radius:999px;padding:9px 18px;background:rgba(110,181,166,.1);}
.head a.myshelf svg{width:18px;height:18px;}
.grid{max-width:1100px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.card{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(80,60,30,.12);transition:transform .15s, box-shadow .15s;}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,30,.2);}
.card .cvlink{display:block;text-decoration:none;color:inherit;}
.card .cv{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f3ecdf;}
.card .ti{font-family:"Noto Serif KR",serif;font-weight:700;font-size:14px;color:#23312e;padding:10px 12px 12px;line-height:1.3;}
.save{position:absolute;top:9px;right:9px;display:inline-flex;align-items:center;gap:5px;border:0;cursor:pointer;
 background:rgba(255,255,255,.92);color:var(--pine);font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:6px 11px;box-shadow:0 2px 8px rgba(80,60,30,.18);}
.save svg{width:15px;height:15px;}
.save.on{background:var(--pine);color:#fff;}
.empty{max-width:1100px;margin:40px auto;text-align:center;color:#8a948f;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(47,93,98,.96);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style></head><body>
<div class="head"><h1>한글 깨우기 책장</h1><p>마음에 드는 책을 <b>담기</b> 하면 「내 서재」에 안전하게 보관돼요</p>
<a class="myshelf" href="../내_서재.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>내 서재 보기 (<span id="cnt">0</span>)</a></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">아직 표지가 완성된 책이 없어요.</div>
<div class="toast" id="toast"></div>
<script src="../js/내서재_담기.js"></script>
<script>
var BOOKS = [{"title": "ㄱㄴㄷ 친구들이 깨어났어요", "sub": "잠자던 자음들이 눈을 뜨고 이름을 찾아가는 이야기", "folder": "001_ㄱㄴㄷ친구들이깨어났어요"}, {"title": "ㅏㅑㅓㅕ 노래하는 모음", "sub": "입을 벌리면 소리가 노래가 돼요", "folder": "002_ㅏㅑㅓㅕ노래하는모음"}, {"title": "받침 없는 글자 나라", "sub": "발 없는 글자들이 사는 동글동글한 마을", "folder": "003_받침없는글자나라"}, {"title": "받침이 콩 하고 떨어졌어요", "sub": "글자 아래 살며시 앉는 작은 친구 이야기", "folder": "004_받침이콩하고떨어졌어요"}, {"title": "두 글자 단어 만들기", "sub": "글자 하나에 글자 하나를 더하면 새 친구가 태어나요", "folder": "005_두글자단어만들기"}, {"title": "세 글자 단어 친구들", "sub": "글자 셋이 모이면 이름이 생겨요", "folder": "006_세글자단어친구들"}, {"title": "헷갈리는 글자 숨바꼭질", "sub": "꼭 닮은 글자들이 숨어 있어요", "folder": "007_헷갈리는글자숨바꼭질"}, {"title": "쌍둥이 글자가 왔어요", "sub": "꼭 닮은 짝꿍 글자, ㄲ ㄸ ㅃ ㅆ ㅉ 이야기", "folder": "008_쌍둥이글자가왔어요"}, {"title": "짧은 문장 첫걸음", "sub": "낱말 둘이 손잡으면 이야기가 시작돼요", "folder": "009_짧은문장첫걸음"}, {"title": "나도 이제 책을 읽어요", "sub": "낱말이 모여 문장이 되는 날", "folder": "010_나도이제책을읽어요"}, {"title": "하나 둘 셋, 숫자가 보여요", "sub": "세어 보면 세상이 환하게 보여요", "folder": "011_하나둘셋숫자가보여요"}, {"title": "0은 아무것도 없어요", "sub": "비어 있어도 자기 자리가 있는 동그란 친구 이야기", "folder": "012_0은아무것도없어요"}, {"title": "10까지 세어 볼까?", "sub": "숫자 친구들이 하나둘 모이는 작은 마을 이야기", "folder": "013_10까지세어볼까"}, {"title": "누가 더 많을까?", "sub": "한 줄로 서면 보여요, 누가 더 많은지", "folder": "014_누가더많을까"}, {"title": "모으면 늘어나요", "sub": "하나에 하나를 더하면 새 친구가 생겨요", "folder": "015_모으면늘어나요"}, {"title": "하나씩 빼면 줄어요", "sub": "꼬마 숫자 다섯이 떠나며 배우는 뺄셈 이야기", "folder": "016_하나씩빼면줄어요"}, {"title": "손가락 더하기 놀이", "sub": "열 손가락이 모이면 무슨 일이 생길까?", "folder": "017_손가락더하기놀이"}, {"title": "사탕을 나눠요", "sub": "하나씩 줄어들수록, 마음은 자꾸 커져요", "folder": "018_사탕을나눠요"}, {"title": "20까지 숫자 친구들", "sub": "하나둘셋, 스물까지 손잡고 가는 길", "folder": "019_20까지숫자친구들"}, {"title": "나는 계산 박사", "sub": "더하고 빼며 풀어가는 숲속 하루", "folder": "020_나는계산박사"}, {"title": "처음 가는 학교, 두근두근", "sub": "낯선 첫 아침이 가장 즐거운 하루가 되기까지", "folder": "021_처음가는학교두근두근"}, {"title": "내 자리는 어디일까?", "sub": "교실 어딘가에 나를 기다리는 자리가 있어요", "folder": "022_내자리는어디일까"}, {"title": "화장실 다녀올게요", "sub": "손을 번쩍 드는 그 한마디, 생각보다 어렵지 않아요", "folder": "024_화장실다녀올게요"}, {"title": "급식 시간이 좋아", "sub": "낯선 식판 앞에서, 용기 한 숟가락", "folder": "025_급식시간이좋아"}, {"title": "줄을 서요", "sub": "한 줄로 서면 모두가 편안해요", "folder": "026_줄을서요"}, {"title": "손을 들고 말해요", "sub": "하고 싶은 말은 손을 들고, 차례가 오면 또박또박", "folder": "027_손을들고말해요"}, {"title": "쉬는 시간 친구들", "sub": "종이 울리면, 우리 마음도 열려요", "folder": "028_쉬는시간친구들"}, {"title": "청소도 함께해요", "sub": "혼자 하면 무거운 빗자루, 함께 들면 가벼워요", "folder": "029_청소도함께해요"}, {"title": "학교가 좋아졌어요", "sub": "낯설던 학교가 어느새 가장 가고 싶은 곳이 되기까지", "folder": "030_학교가좋아졌어요"}, {"title": "오늘은 기분이 좋아", "sub": "마음속에서 통통 튀는 작은 기쁨 이야기", "folder": "031_오늘은기분이좋아"}, {"title": "눈물이 났어요", "sub": "슬픔이 찾아와도 괜찮아, 함께 있어 줄게", "folder": "032_눈물이났어요"}, {"title": "화가 나, 부글부글", "sub": "마음속 작은 부글이를 가만히 바라보면", "folder": "033_화가나부글부글"}, {"title": "무서워서 떨려요", "sub": "내 안의 작은 떨림이를 만나 이름을 불러 주기까지", "folder": "034_무서워서떨려요"}, {"title": "부끄러워 얼굴이 빨개졌어", "sub": "볼이 발그레, 그건 마음이 보내는 신호래요", "folder": "035_부끄러워얼굴이빨개졌어"}, {"title": "심심해, 뭐 하지?", "sub": "잿빛 구름 심심이와 보낸 느릿한 하루", "folder": "036_심심해뭐하지"}, {"title": "깜짝 놀랐어!", "sub": "가슴이 콩 뛰는 그 순간, 반짝이가 찾아와요", "folder": "037_깜짝놀랐어"}, {"title": "시간을 모으는 소년", "sub": "하루 24시간, 그릇에 담기다", "folder": "202_시간을모으는소년"}, {"title": "거울 친구", "sub": "나를 보는 그 자리에서 변화가 시작된다", "folder": "203_거울친구"}, {"title": "도서관의 비밀 문", "sub": "한 시간의 깊은 발견", "folder": "204_도서관의비밀문"}, {"title": "아빠의 작은 가방", "sub": "그 안에 담긴 다섯 가지", "folder": "205_아빠의작은가방"}, {"title": "떠나는 새와 남는 새", "sub": "두 새의 마지막 밤", "folder": "206_떠나는새와남는새"}, {"title": "시간이 멈춘 교실", "sub": "멈춘 그 순간에 본 것들", "folder": "302_시간이멈춘교실"}, {"title": "다섯 명의 발명가", "sub": "다섯이 하나로", "folder": "303_다섯명의발명가"}, {"title": "잃어버린 단어 사전", "sub": "공간이 가르쳐 준 9개 단어", "folder": "304_잃어버린단어사전"}, {"title": "옆 반 친구의 비밀", "sub": "두 사람 사이의 한 노트", "folder": "305_옆반친구의비밀"}, {"title": "첫 모험가의 일기", "sub": "짧은 22개의 챕터", "folder": "306_첫모험가의일기"}, {"title": "거짓말 탐지기", "sub": "한 점심시간의 깊은 농도", "folder": "402_거짓말탐지기"}, {"title": "다섯 번째 계절", "sub": "마음 안에 머무는 시간", "folder": "403_다섯번째계절"}, {"title": "친구가 이사 갔다", "sub": "일기와 편지로 잇는 사이", "folder": "404_친구가이사갔다"}, {"title": "학급 신문 만들기", "sub": "24개의 짧은 장면", "folder": "405_학급신문만들기"}, {"title": "동물원의 늙은 사자", "sub": "한 마주침의 시간", "folder": "406_동물원의늙은사자"}, {"title": "사춘기 일기장", "sub": "흔들리는 나를 가만히 안아 주는 밤", "folder": "502_사춘기일기장"}, {"title": "친구의 비밀을 알았다", "sub": "누군가의 무게를 함께 들기로 한 날", "folder": "503_친구의비밀을알았다"}, {"title": "연아카데미 가는 길", "sub": "내가 걸어서 닿는 길", "folder": "504_연아카데미가는길"}, {"title": "부모님과의 다툼", "sub": "같은 밤, 두 마음", "folder": "505_부모님과의다툼"}, {"title": "인공지능 친구", "sub": "편리한 친구와 따뜻한 친구 사이", "folder": "506_인공지능친구"}];
var grid=document.getElementById('grid');
if(!BOOKS.length){ document.getElementById('empty').style.display='block'; }
var I_ADD='<path d="M12 5v14M5 12h14"/>', I_OK='<path d="M20 6L9 17l-5-5"/>';
function btnHtml(i){ var on=YeonShelf.has(BOOKS[i].folder);
  return '<button class="save'+(on?' on':'')+'" data-i="'+i+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(on?I_OK:I_ADD)+'</svg>'+(on?'담음':'담기')+'</button>'; }
grid.innerHTML = BOOKS.map(function(b,i){
  var f=encodeURI(b.folder);
  return '<div class="card"><a class="cvlink" href="'+f+'/시범_낱말지도.html"><img class="cv" src="'+f+'/images/cover.png" alt="" loading="lazy"></a>'
    + btnHtml(i) + '<div class="ti">'+b.title+'</div></div>';
}).join('');
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on');},1500); }
function refreshCnt(){ document.getElementById('cnt').textContent=YeonShelf.count(); }
grid.addEventListener('click', function(e){
  var btn=e.target.closest('.save'); if(!btn) return;
  e.preventDefault();
  var i=+btn.getAttribute('data-i'); var b=BOOKS[i];
  var added=YeonShelf.toggle({folder:b.folder,title:b.title,memo:b.sub});
  btn.outerHTML=btnHtml(i); refreshCnt();
  toast(added?('"'+b.title+'" 내 서재에 담았어요'):('"'+b.title+'" 책장에서 뺐어요'));
});
refreshCnt();
</script></body></html>
