<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f9f9f9; stroke: #333; stroke-width: 2; }
      .header-box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .section-box { fill: #ffffff; stroke: #999; stroke-width: 2; }
      .subsection-box { fill: #fafafa; stroke: #ccc; stroke-width: 1.5; }
      .text-title { font-size: 16px; font-weight: bold; fill: #000; text-anchor: middle; }
      .text-subtitle { font-size: 12px; fill: #333; text-anchor: middle; }
      .text-small { font-size: 11px; fill: #666; text-anchor: middle; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- 제목 -->
  <rect x="50" y="20" width="1100" height="80" class="header-box" rx="10"/>
  <text x="600" y="55" class="text-title" font-size="20">Y LIFE 웹사이트 구조도</text>
  <text x="600" y="80" class="text-subtitle">삶·인연·소통, 그 깊은 연으로 잇다</text>

  <!-- 헤더 영역 -->
  <rect x="50" y="140" width="1100" height="100" class="section-box" rx="8"/>
  <text x="600" y="170" class="text-title">📌 헤더 영역</text>
  <rect x="100" y="185" width="300" height="35" class="subsection-box" rx="5"/>
  <text x="250" y="207" class="text-subtitle">로고: 緣 Y LIFE</text>
  <rect x="450" y="185" width="650" height="35" class="subsection-box" rx="5"/>
  <text x="775" y="207" class="text-subtitle">네비게이션 (홈, 철학, 소식, 필진, 문의)</text>

  <!-- 메인 콘텐츠 -->
  <text x="600" y="290" class="text-title" font-size="18">🎯 메인 콘텐츠</text>

  <!-- 섹션 1: 히어로 -->
  <rect x="50" y="310" width="220" height="140" class="section-box" rx="8"/>
  <text x="160" y="335" class="text-title">🌟 히어로</text>
  <rect x="70" y="350" width="180" height="30" class="subsection-box" rx="4"/>
  <text x="160" y="370" class="text-small">삶·인연·소통</text>
  <rect x="70" y="385" width="180" height="30" class="subsection-box" rx="4"/>
  <text x="160" y="405" class="text-small">철학둘러보기</text>
  <text x="160" y="440" class="text-small">& 人 버튼</text>

  <!-- 섹션 2: 철학 4대 기둥 -->
  <rect x="300" y="310" width="880" height="140" class="section-box" rx="8"/>
  <text x="740" y="335" class="text-title">🧭 철학 4대 기둥</text>
  <rect x="320" y="350" width="200" height="85" class="subsection-box" rx="4"/>
  <text x="420" y="370" class="text-subtitle">Connecting</text>
  <text x="420" y="390" class="text-small">배움의 인연</text>
  <text x="420" y="410" class="text-small">학생의 공간</text>
  <rect x="540" y="350" width="200" height="85" class="subsection-box" rx="4"/>
  <text x="640" y="370" class="text-subtitle">Guiding</text>
  <text x="640" y="390" class="text-small">무모의 지혜</text>
  <text x="640" y="410" class="text-small">학부모의 공간</text>
  <rect x="760" y="350" width="200" height="85" class="subsection-box" rx="4"/>
  <text x="860" y="370" class="text-subtitle">Witnessing</text>
  <text x="860" y="390" class="text-small">연의 시선</text>
  <text x="860" y="410" class="text-small">한국과 세계</text>
  <rect x="980" y="350" width="180" height="85" class="subsection-box" rx="4"/>
  <text x="1070" y="370" class="text-subtitle">Thinking</text>
  <text x="1070" y="390" class="text-small">연의 서재</text>
  <text x="1070" y="410" class="text-small">연소사 감담</text>

  <!-- 섹션 3: 사랑방 -->
  <rect x="50" y="480" width="540" height="150" class="section-box" rx="8"/>
  <text x="320" y="505" class="text-title">💬 사랑방</text>
  <rect x="70" y="525" width="500" height="35" class="subsection-box" rx="4"/>
  <text x="320" y="547" class="text-small">지금 마음에 있는 것을 꺼내놓으세요</text>
  <rect x="70" y="570" width="500" height="35" class="subsection-box" rx="4"/>
  <text x="320" y="592" class="text-small">마음에 품은 질문을 입력</text>
  <rect x="70" y="605" width="500" height="15" class="subsection-box" rx="3"/>
  <text x="320" y="614" class="text-small" font-size="9">인연을 묻다 버튼</text>

  <!-- 섹션 4: 방법론 -->
  <rect x="620" y="480" width="530" height="150" class="section-box" rx="8"/>
  <text x="885" y="505" class="text-title">📖 방법론 3가지</text>
  <rect x="640" y="525" width="160" height="80" class="subsection-box" rx="4"/>
  <text x="720" y="550" class="text-subtitle">5.2.5.5</text>
  <text x="720" y="570" class="text-small">학습법</text>
  <rect x="820" y="525" width="160" height="80" class="subsection-box" rx="4"/>
  <text x="900" y="550" class="text-subtitle">의식적</text>
  <text x="900" y="570" class="text-small">몸입</text>
  <rect x="1000" y="525" width="140" height="80" class="subsection-box" rx="4"/>
  <text x="1070" y="550" class="text-subtitle">배려·</text>
  <text x="1070" y="570" class="text-small">배움·놀기</text>

  <!-- 섹션 5: 격언 -->
  <rect x="50" y="660" width="1100" height="90" class="section-box" rx="8"/>
  <text x="600" y="685" class="text-title">✨ 연소사의 격언</text>
  <text x="600" y="715" class="text-small">"완벽한 하루가 쌓이는 것이 아니라,</text>
  <text x="600" y="733" class="text-small">불완전한 하루가 이어지는 것이 진짜 구준합입니다."</text>

  <!-- 섹션 6: 서재 -->
  <rect x="50" y="780" width="1100" height="200" class="section-box" rx="8"/>
  <text x="600" y="805" class="text-title">📚 연의 서재 (최신 글)</text>
  <text x="1000" y="805" class="text-small" fill="#666">전체보기</text>

  <rect x="80" y="830" width="320" height="130" class="subsection-box" rx="4"/>
  <text x="240" y="855" class="text-small">2026.04.10 · 지기우도</text>
  <text x="240" y="875" class="text-subtitle" font-size="11">"100일 숨감에서</text>
  <text x="240" y="892" class="text-subtitle" font-size="11">가장 위험한 시기는"</text>
  <text x="240" y="925" class="text-small" font-size="9">15일에서 21일 사이...</text>

  <rect x="430" y="830" width="320" height="130" class="subsection-box" rx="4"/>
  <text x="590" y="855" class="text-small">2026.04.05 · 학부모</text>
  <text x="590" y="875" class="text-subtitle" font-size="11">"아이의 말을 듣는 때</text>
  <text x="590" y="892" class="text-subtitle" font-size="11">가장 먼저 버려야 할 것"</text>
  <text x="590" y="925" class="text-small" font-size="9">판단이다. 아이는...</text>

  <rect x="780" y="830" width="340" height="130" class="subsection-box" rx="4"/>
  <text x="950" y="855" class="text-small">2026.03.28 · 질현</text>
  <text x="950" y="875" class="text-subtitle" font-size="11">"의식적 몸입은</text>
  <text x="950" y="892" class="text-subtitle" font-size="11">결과가 아니라 과정"</text>
  <text x="950" y="925" class="text-small" font-size="9">집중-흔어짐-둑아옴...</text>

  <!-- 화살표 -->
  <path d="M 160 250 L 160 310" class="arrow"/>
  <path d="M 320 250 L 420 310" class="arrow"/>
  <path d="M 640 250 L 640 310" class="arrow"/>
  <path d="M 885 250 L 885 310" class="arrow"/>
  <path d="M 1070 250 L 1070 310" class="arrow"/>
</svg>