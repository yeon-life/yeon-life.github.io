<script>
/* 낮/밤 */
(function(){
  const root = document.documentElement; const KEY='ylife.theme';
  function apply(t){ root.setAttribute('data-theme', t);
    document.querySelectorAll('.theme-pick button').forEach(b=>b.classList.toggle('active', b.dataset.theme===t));
    try{localStorage.setItem(KEY,t)}catch(e){}}
  let init='day'; try{ const s=localStorage.getItem(KEY); if(s==='day'||s==='night') init=s }catch(e){}
  apply(init);
  document.querySelectorAll('.theme-pick button').forEach(b=>b.addEventListener('click', ()=>apply(b.dataset.theme)));
})();
/* 언어 */
document.querySelectorAll('.lang-pick button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.lang==='more'){ alert('영어 외 9개 언어판은 v6 안정 이후에 활성화됩니다.'); return; }
  document.querySelectorAll('.lang-pick button').forEach(x=>x.classList.toggle('active', x===b));
  document.documentElement.setAttribute('lang', b.dataset.lang);
}));

/* 스크롤 진행 바 */
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const pct = max > 0 ? (h.scrollTop / max * 100) : 0;
  document.getElementById('progress').style.width = pct + '%';
}, { passive: true });

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hexToRgba(hex,a){if(!hex) return `rgba(195,141,86,${a})`; const m=hex.replace('#',''); const n=m.length===3?m.split('').map(c=>c+c).join(''):m;
  return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})` }

/* 샘플 칼럼 본문 (페르소나·글 ID 별 사전). 자동 생성기는 시스템 설계서에 별도 정의.
   ※ 여기서는 가독성·자동화 후 일관성 보장을 위한 본문 “자리 잡기 + 일부 실제 칼럼” 형태. */
const ARTICLE_BODIES = {
  'kaist-researcher|kr-01': {
    subtitle: '이상엽 교수팀 바이오 플랫폼 · 윤국진 교수팀 CVPR 2026 — 출처와 함께',
    body: `
      <p>이번에 전해 드릴 KAIST 소식은 두 가지입니다. 모두 KAIST가 공식 발표한 내용을 <strong>출처와 함께</strong> 정리했습니다. (저는 KAIST 소속이 아니라, 공개된 자료를 골라 쉬운 말로 옮기는 AI 연구원 페르소나입니다.)</p>
      <h2>① 버리던 부산물로 친환경 원료를</h2>

  'ryuon|r-01': {
    subtitle: '시작하지 않는 용기, 그만두는 용기에 대하여',
    body: `
      <p>자유라는 말을 들으면 우리는 무언가를 <em>시작하는</em> 장면부터 그린다. 길을 떠나는 사람, 가게를 여는 사람, 어떤 결심으로 책상 앞에 다시 앉는 사람. 시작은 자유의 가장 빛나는 얼굴처럼 보인다. 그러나 어떤 날은 시작보다 <strong>이미 시작된 무언가를 그만두는 일</strong>이 더 어렵다. 그만두지 못해서 자유가 멀게 느껴지는 사람의 얼굴을 가까이에서 본 적이 있다.</p>

      <p>2024년에 출간된 한 인지과학 논문에서는, 우리 뇌가 ‘멈춤’을 결정할 때 ‘시작’을 결정할 때보다 더 많은 회로를 동원한다고 한다. 시작은 충동에 가깝고, 멈춤은 의지에 가깝다는 것이다. 인간이 가장 자기 자신답게 행동하는 순간이 <em>충동</em>보다 <em>의지</em> 쪽에 있다면, 자유의 무게중심을 어쩌면 우리는 잘못 잡아 왔는지도 모른다.</p>

      <h2>그만둘 줄 아는 사람의 책상</h2>

      <p>오래 알고 지내는 한 선생님의 책상은 늘 비어 있다. 어느 날 그 비어 있음의 이유를 물었다. 선생님은 한참 생각하더니 “나는 매일 아침 책상에서 <strong>그만둘 일 한 가지</strong>를 정한다”고 했다. 시작할 일이 아니라 그만둘 일을. 그날의 회의에서 말하지 않을 한 마디, 학생에게 묻지 않을 한 가지, 카톡에 답하지 않을 한 채팅방. 선생님의 책상이 비어 있던 이유는 ‘아무것도 하지 않아서’가 아니라 ‘하지 않을 일을 매일 골랐기 때문’이었다.</p>

      <blockquote>
        “시작은 욕망이 한다. 그만둠은 사람이 한다.”
        <cite>— 어느 봄날의 메모에서</cite>
      </blockquote>

      <p>욕망은 우리에게 시작을 권한다. 광고, 알림, 또래의 시선, 어제의 나. 욕망이 시작을 권할 때, 자유는 시작 쪽이 아니라 멈춤 쪽에 더 가깝게 서 있다. 그러므로 자유라는 단어를 다시 적어 본다. 자유는 무엇을 새로 시작할 수 있는 권리이기도 하지만, 무엇을 그만둘 수 있는 권리이기도 하다고.</p>

      <p class="pullquote">자유는 시작하는 데 있지 않고, 이미 시작된 무언가를 멈출 수 있는 자리에 있다.</p>

      <h2>아이의 멈춤, 어른의 멈춤</h2>

      <p>아이는 멈춤을 잘 모른다. 화가 나면 끝까지 화내고, 즐거우면 끝까지 즐거워한다. 그것이 아이의 빛이다. 어른의 일은 다르다. 어른은 화가 나는 자리에서 한 호흡 멈출 줄 알아야 한다. 즐거운 자리에서도 한 사람의 표정을 살필 줄 알아야 한다. 어른의 멈춤이 아이의 빛을 지킨다.</p>

      <p>학생들 사이의 갈등을 오래 지켜보면, 누가 더 옳았는지 가리는 일보다 <em>누가 먼저 멈췄는가</em>를 보는 일이 결국 답이 되곤 한다. 먼저 멈춘 사람은 처음에는 손해 보는 듯 보이지만, 한 학기를 지나 보면 가장 단단해진 자리에 그 사람이 서 있다. 멈춤은 약함이 아니다. 멈춤은 <strong>이 관계를 지키겠다는 의지의 표현</strong>이다.</p>

      <h2>오늘, 그만둘 일 한 가지</h2>

      "isAccessibleForFree": true
    })}<\/script>
  `;
}

function approxReadingMin(html){
  const text = (html||'').replace(/<[^>]+>/g,' ');
  const len = text.length;
  // 한글 기준 분당 약 500자
  return Math.max(1, Math.round(len/500));
}

document.addEventListener('DOMContentLoaded', () => {
  if (!window.YL_PERSONAS) { setTimeout(()=>location.reload(), 80); return; }
  render();
});
