<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GitHub 파일 업로더</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; background: #f5f5f5; }
  h2 { color: #333; }
  .box { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  input[type=file] { display: block; margin: 16px 0; }
  button { background: #2ea44f; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 16px; cursor: pointer; }
  button:hover { background: #2c974b; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #status { margin-top: 20px; font-size: 15px; line-height: 1.6; }
  .ok { color: #2ea44f; font-weight: bold; }
  .err { color: #d00; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h2>🚀 GitHub 파일 업로더</h2>
  <p>수정된 <strong>index.html</strong>을 GitHub에 올립니다.</p>

  <label>① index.html 파일 선택:</label>
  <input type="file" id="fileInput" accept=".html">

  <button id="uploadBtn" onclick="upload()" disabled>② GitHub에 업로드</button>
  <div id="status"></div>
</div>

<script>
const TOKEN = 'ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';
const REPO  = 'yeon-life/yeon-life.github.io';
const FILE  = 'index.html';
const API   = `https://api.github.com/repos/${REPO}/contents/${FILE}`;

let fileContent = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    fileContent = ev.target.result;
    document.getElementById('uploadBtn').disabled = false;
    document.getElementById('status').innerHTML = `<span class="ok">✓ 파일 읽기 완료 (${(file.size/1024).toFixed(1)}KB)</span>`;
  };
  reader.readAsArrayBuffer(file);
});

async function upload() {
  const btn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerHTML = '⏳ GitHub에서 현재 SHA 가져오는 중...';

  try {
    // 1. 현재 SHA 가져오기
    const infoRes = await fetch(API, {
      headers: { Authorization: `token ${TOKEN}`, 'User-Agent': 'browser-uploader' }
    });
    if (!infoRes.ok) throw new Error(`SHA 가져오기 실패: ${infoRes.status}`);
    const info = await infoRes.json();
    const sha = info.sha;
    status.innerHTML = `✓ SHA 확인: ${sha.slice(0,7)}...<br>⏳ 파일 업로드 중...`;

    // 2. Base64 인코딩
    const bytes = new Uint8Array(fileContent);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    const base64 = btoa(binary);

    // 3. 업로드
    const uploadRes = await fetch(API, {
      method: 'PUT',
      headers: {
        Authorization: `token ${TOKEN}`,
        'Content-Type': 'application/json',
        'User-Agent': 'browser-uploader'
      },
      body: JSON.stringify({
        message: 'fix: 관리자 대시보드 오류 수정 + 비밀번호 마스터키 + 눈아이콘',
        content: base64,
        sha: sha
      })
    });

    if (!uploadRes.ok) {
      const err = await uploadRes.json();
      throw new Error(err.message || uploadRes.status);
    }

    status.innerHTML = `<span class="ok">🎉 업로드 성공! GitHub에 반영됐습니다.<br>1~2분 후 y-life.kr 새로고침(Ctrl+Shift+R)하세요.</span>`;
  } catch(e) {
    status.innerHTML = `<span class="err">❌ 오류: ${e.message}</span>`;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
