  <!-- 작은 점선 — 생각의 별자리 느낌 -->
  <circle cx="40" cy="40" r="3" fill="#f3e7dd" opacity="0.5"/>
  <circle cx="152" cy="48" r="2" fill="#f3e7dd" opacity="0.5"/>
  <circle cx="48" cy="152" r="2" fill="#f3e7dd" opacity="0.5"/>
  <circle cx="156" cy="148" r="3" fill="#f3e7dd" opacity="0.5"/>
