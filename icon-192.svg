    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f5d62"/>
      <stop offset="100%" stop-color="#427a71"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- 緣 한자 — yp-accent (구리) -->
